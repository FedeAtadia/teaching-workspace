name: CI

# Runs on every pull request into a protected branch, and again on the branch
# itself after a merge. The pull_request run is the one that gates a merge; the
# push run is what tells you main is still green once something has landed.
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# A newer commit makes an in-flight run pointless, so stop it and start again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Node version in .nvmrc, the same one used locally. It matters
      # beyond the runtime: each Node ships its own npm, and npm 10 and 11
      # disagree about which optional packages a lockfile must list, so a
      # lockfile written on one fails `npm ci` on the other.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the lockfile and package.json disagree.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Also runs TypeScript. No Supabase secrets here on purpose: the app is
      # built to compile without them (the database is opened on first use).
      - name: Build
        run: npm run build
