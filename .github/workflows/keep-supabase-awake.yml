# Supabase's free plan pauses a project that gets too little activity over a
# week. Its docs ask for "a few user requests to the database each day", so
# this touches each project twice a day, school holidays included, in two ways:
#
#   - one read through Supabase's API (the activity the docs name), and
#   - one read on the database itself, through the connection pooler.
#
# Neither returns any data or writes anything. Each project needs two
# repository secrets; a missing one fails the run, so GitHub emails about it.
#
#   SUPABASE_DEV_DB_URL             the DATABASE_URL in .env.local
#   SUPABASE_DEV_PUBLISHABLE_KEY    the NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env.local
#   SUPABASE_PROD_DB_URL            the DATABASE_URL in .env.prod
#   SUPABASE_PROD_PUBLISHABLE_KEY   the prod project's publishable key (dashboard → API Keys)
#
# Scheduled runs only start from `main`. It can also be run by hand from the
# Actions tab.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9,21 * * *" # twice a day, 06:17 and 18:17 in Argentina
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            url: https://chkfeznnfpugyatwuzxd.supabase.co
            db_secret: SUPABASE_DEV_DB_URL
            key_secret: SUPABASE_DEV_PUBLISHABLE_KEY
          - name: prod
            url: https://dlqvhxmskpaumultxmjt.supabase.co
            db_secret: SUPABASE_PROD_DB_URL
            key_secret: SUPABASE_PROD_PUBLISHABLE_KEY
    steps:
      - name: Call the ${{ matrix.name }} API
        env:
          KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The ${{ matrix.key_secret }} secret isn't set."
            exit 1
          fi
          # RLS lets the publishable key read nothing, so this answers [] (HTTP 200).
          curl --silent --show-error --fail-with-body --max-time 30 \
            --write-out '\nHTTP %{http_code}\n' \
            --header "apikey: $KEY" \
            "${{ matrix.url }}/rest/v1/schools?select=id&limit=1"

      - name: Read from the ${{ matrix.name }} database
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets[matrix.db_secret] }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The ${{ matrix.db_secret }} secret isn't set."
            exit 1
          fi
          # One row count: real database activity, nothing written.
          psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only \
            --command "select 'schools: ' || count(*) from schools;"
